[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balancebot"
version = "1.0.0"
description = "BLE dashboard and software-in-the-loop sim for the STM32 balancing robot"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.4",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
balancebot-dash = "balancebot.dashboard.app:main"
balancebot-sim = "balancebot.sim:main"

[tool.setuptools.packages.find]
include = ["balancebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
